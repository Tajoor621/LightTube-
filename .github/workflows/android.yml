name: Verify LightTube
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDevDebug :app:lintDevDebug :app:assembleProdRelease
      - uses: actions/upload-artifact@v4
        with:
          name: LightTube-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['35', '36', '37.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDevDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightTube-device-results-${{ matrix.image }}
          path: app/build/outputs/androidTest-results/connected/
